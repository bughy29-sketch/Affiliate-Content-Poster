name: Pinterest Pins

on:
  schedule:
    # Zilnic la 09:17 UTC. Începe conservator; crește frecvența doar după ce
    # contul arată că tolerază volumul.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validează, nu publică)"
        type: boolean
        default: true
      max_pins:
        description: "Număr maxim de pinuri în această rulare"
        type: string
        default: "3"

permissions:
  contents: write

concurrency:
  group: pinterest-pins
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PINTEREST_CLIENT_ID: ${{ secrets.PINTEREST_CLIENT_ID }}
      PINTEREST_CLIENT_SECRET: ${{ secrets.PINTEREST_CLIENT_SECRET }}
      PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
      AFFILIATE_DISCLOSURE: ${{ vars.AFFILIATE_DISCLOSURE }}
      # Dispatch manual: implicit dry-run. Cron: publicare reală.
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      MAX_PINS_PER_RUN: ${{ inputs.max_pins || '3' }}
      MIN_DELAY_SECONDS: "30"
      MAX_DELAY_SECONDS: "90"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduler
        run: python -m src.main

      - name: Commit state
        if: ${{ always() && env.DRY_RUN == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "Fără modificări de stare."
          else
            git commit -m "chore: update pin state [skip ci]"
            git push
          fi
